name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        run: python -m compileall -q app.py kanban scripts tests
      - name: Run unit and API tests
        run: python -m unittest discover -v
      - name: Check database administration
        env:
          DATABASE_PATH: /tmp/flowboard-ci.db
        run: |
          python scripts/db_admin.py init
          python scripts/db_admin.py check
